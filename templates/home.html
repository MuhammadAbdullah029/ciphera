<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Ciphera</title>

<!-- Remix Icons -->
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* BODY */
body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: #000; /* full dark background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #fff;
}

/* FRAME */
#frame {
    width: 95%;
    max-width: 1100px;
    height: 92vh;
    background: #111; /* dark card */
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(255,255,255,0.05);
    display: flex;
    overflow: hidden;
}

/* SIDE PANEL */
#sidepanel {
    width: 300px;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    padding: 25px 0;
}

/* PROFILE */
#profile {
    text-align: center;
    margin-bottom: 30px;
}
#profile img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid #f44336; /* red border */
}
#profile p {
    margin-top: 12px;
    font-size: 18px;
    font-weight: 600;
    color: #f5f5f5;
}

/* SEARCH */
#search {
    padding: 0 20px;
    position: relative;
    margin-bottom: 20px;
}
#search input {
    width: 80%;
    padding: 10px 14px 10px 40px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #222;
    color: #fff;
}
#search i {
    position: absolute;
    top: 50%;
    left: 11%;
    transform: translateY(-50%);
    color: #aaa;
}

/* CONTACTS */
#contacts {
    flex-grow: 1;
    overflow-y: auto;
}
#contacts ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
#contacts ul li {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.2s;
}
#contacts ul li:hover,
#contacts ul li.active {
    background: #2c2c2c;
}
#contacts img {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    margin-right: 12px;
    border: 2px solid #f44336; padding: .5rem;
}
.meta .name {
    font-weight: 600;
    color: #fff;
}
.preview {
    font-size: 12px;
    color: #aaa;
}

/* BOTTOM BAR */
#bottom-bar {
    padding: 10px 20px;
    border-top: 1px solid #333;
}
#bottom-bar button {
    width: 100%;
    border: none;
    padding: 12px 0;
    margin-bottom: 8px;
    background: #222;
    color: #fff;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    transition: 0.25s;
}
#bottom-bar button:hover {
    background: #f44336; /* red highlight */
}

/* CHAT CONTENT */
.content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    background: #111; /* dark content */
}

/* CONTACT PROFILE */
.contact-profile {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #222;
}
.contact-profile img {
    width: 45px;
    border-radius: 50%;
    border: 2px solid #f44336;
    margin-right: 12px; padding: 5px;
}
.contact-profile p {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
}

/* MESSAGES */
.messages {
    flex-grow: 1;
    padding: 20px;
    overflow-y: auto;
}
.messages ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
.messages ul li {
    margin-bottom: 18px;
    display: flex;
    align-items: flex-end;
    max-width: 75%;
}
.sent {
    flex-direction: row;
}
.sent p {
    background: #f44336; /* red sent messages */
    color: #fff;
    margin-left: 10px;
}
.replies {
    flex-direction: row-reverse;
    margin-left: auto;
}
.replies p {
    background: #222;
    color: #fff;
    margin-right: 10px;
}
.messages img {
    width: 32px;
    border-radius: 50%;
}
.messages p {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 14px;
}

/* MESSAGE INPUT */
.message-input {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #222;
}
#textInput {
    width: 95%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #222;
    color: #fff;
}
.submit {
    border: none;
    background: #f44336; /* red send button */
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.25s;
}
.submit:hover {
    background: #d32f2f;
}
</style>
</head>
<body>

<div id="frame">
    <!-- LEFT PANEL -->
    <div id="sidepanel">
        <div id="profile">
            <img src="/static/logo.png" alt="profile" class="online">
            <p>{{ username }}</p>
        </div>

        <div id="search">
            <i class="ri-search-line"></i>
            <input type="text" placeholder="Search contacts...">
        </div>

        <div id="contacts">
            <ul>
                <li class="contact active">
                    <img src="https://miro.medium.com/max/327/1*paQ7E6f2VyTKXHpR-aViFg.png">
                    <div class="meta">
                        <p class="name">Ciphera</p>
                        <p class="preview">Assistant Bot</p>
                    </div>
                </li>
            </ul>
        </div>

        <div id="bottom-bar">
            <button><i class="ri-user-add-line"></i>Add Contact</button>
            <button id="logout"><i class="ri-shut-down-line"></i>Logout</button>
        </div>
    </div>

    <!-- RIGHT CHAT AREA -->
    <div class="content">
        <div class="contact-profile">
            <img src="https://miro.medium.com/max/327/1*paQ7E6f2VyTKXHpR-aViFg.png">
            <p>Ciphera</p>
        </div>

        <div class="messages">
            <ul>
                <li class="sent">
                    <img src="/static/logo.png">
                    <p>Hello! Please write your message to begin.</p>
                </li>
                <li class="replies">
                    <img src="https://miro.medium.com/max/327/1*paQ7E6f2VyTKXHpR-aViFg.png">
                    <p>Hello! I am Ciphera.</p>
                </li>
            </ul>
        </div>

        <div class="message-input">
            <input id="textInput" type="text" placeholder="Write your message...">
            <button class="submit"><i class="ri-send-plane-2-line"></i></button>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(".messages").animate({ scrollTop: $(document).height() }, "fast");

function newMessage() {
    message = $("#textInput").val();
    if ($.trim(message) === "") return;

    $('<li class="sent"><img src="/static/logo.png"><p>' + message + '</p></li>')
        .appendTo(".messages ul");

    $.get("/get", { msg: message }).done(function(data) {
        $('<li class="replies"><img src="https://miro.medium.com/max/327/1*paQ7E6f2VyTKXHpR-aViFg.png"><p>' + data + '</p></li>')
            .appendTo(".messages ul");
    });

    $("#textInput").val("");
    $(".messages").animate({ scrollTop: $(document).height() }, "fast");
}

$(".submit").click(function() { newMessage(); });

$(window).on("keydown", function(e) {
    if (e.which === 13) {
        newMessage();
        return false;
    }
}); $("#logout").click(function() {
      // Redirect to logout route
      window.location.href = "/logout";
  });
</script>

</body>
</html>
